backend:
  name: github
  repo: Louaq/louaq.github.io
  branch: master

media_folder: /public/assets/images
public_folder: /assets/images

collections:
  - name: posts
    label: 文章
    folder: /src/content/posts
    extension: md
    format: frontmatter
    create: true
    nested:
      depth: 3
      subfolders: false
    summary: "{{published | date('YYYY-MM-DD')}} · {{title}}"
    sortable_fields: [published, title, category]
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: published, label: 发布时间, widget: datetime, format: "YYYY-MM-DD HH:mm:ss" }
      - { name: updated, label: 更新时间, widget: datetime, format: "YYYY-MM-DD HH:mm:ss", required: false }
      - { name: description, label: 摘要, widget: text, required: false }
      - { name: image, label: 封面, widget: image, required: false }
      - { name: category, label: 分类, widget: string, required: false }
      - { name: tags, label: 标签, widget: list, required: false }
      - { name: draft, label: 草稿, widget: boolean, default: false, required: false }
      - { name: pinned, label: 置顶, widget: boolean, default: false, required: false }
      - { name: comment, label: 评论, widget: boolean, default: true, required: false }
      - { name: slug, label: 自定义路径, widget: string, required: false }
      - { name: lang, label: 语言, widget: string, required: false }
      - { name: author, label: 作者, widget: string, required: false }
      - { name: sourceLink, label: 来源链接, widget: string, required: false }
      - { name: licenseName, label: 许可名称, widget: string, required: false }
      - { name: licenseUrl, label: 许可链接, widget: string, required: false }
      - { name: homeCarousel, label: 首页轮播, widget: boolean, default: false, required: false }
      - { name: homeCarouselOrder, label: 轮播顺序, widget: number, value_type: int, required: false }
      - { name: homeCarouselImage, label: 轮播图, widget: image, required: false }
      - { name: body, label: 正文, widget: markdown }
